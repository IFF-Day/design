name: Set up the private commit
description: Opens a check run on the private commit, checks it out into app/ and installs its dependencies.
inputs:
  check:
    description: Name of the check run on the commit
    required: true
  client-id:
    required: true
  private-key:
    required: true
  repository:
    description: The source repository's name
    required: true
outputs:
  token:
    description: A token of the iffday app
    value: ${{ steps.app.outputs.token }}
  check-run:
    description: ID of the check run
    value: ${{ steps.check.outputs.id }}
runs:
  using: composite
  steps:
    # Read from the event file and masked, so no log shows the commit.
    - name: Read the commit
      shell: bash
      run: |
        sha=$(jq -r .inputs.sha "$GITHUB_EVENT_PATH")
        echo "::add-mask::$sha"
        echo "SHA=$sha" >> "$GITHUB_ENV"
    - id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        # Kept until it expires: parallel jobs may be given the same one.
        skip-token-revoke: true
        private-key: ${{ inputs.private-key }}
        owner: IFF-Day
        repositories: ${{ inputs.repository }}
        permission-metadata: read
        permission-checks: write
        permission-contents: read
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        NAME: ${{ inputs.check }}
      run: |
        cp "$GITHUB_ACTION_PATH/../../quiet" /tmp/quiet
        : > /tmp/job.log
        id=$(gh api "repos/$SOURCE/check-runs" -f name="$NAME" -f head_sha="$SHA" \
          -f status=in_progress -f details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .id)
        echo "id=$id" >> "$GITHUB_OUTPUT"
    # Downloaded by hand: actions/checkout prints the commit's subject.
    - name: Check out the commit
      shell: bash /tmp/quiet {0}
      env:
        TOKEN: ${{ steps.app.outputs.token }}
      run: |
        for path in "repos/$SOURCE" "repos/$SOURCE/commits/$SHA" "repos/$SOURCE/contents/package.json?ref=$SHA" "repos/$SOURCE/git/commits/$SHA" "installation/repositories"; do
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/$path")
          echo "diag ${path%%\?*} $code"
        done
        curl -s -H "Authorization: Bearer $TOKEN" https://api.github.com/installation/repositories | jq -r '"diag repos: \(.total_count) \([.repositories[].name] | join(","))"'
        mkdir app
        curl -sSfL --retry 4 --retry-all-errors -H "Authorization: Bearer $TOKEN" \
          -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$SOURCE/tarball/$SHA" |
          tar -xz --strip-components=1 -C app
    - name: Check the commit has its CI tasks
      shell: bash
      run: |
        if [ ! -f app/scripts/ci.sh ]; then
          echo "This commit has no scripts/ci.sh; merge main into it." | tee -a /tmp/job.log
          exit 1
        fi
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: app/package.json
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: app/pnpm-lock.yaml
    - name: Install dependencies
      shell: bash /tmp/quiet {0}
      working-directory: app
      run: pnpm install --frozen-lockfile
